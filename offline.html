<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline · Masj.id</title>
    <style>
        :root { --bg:#f4f7f5; --card:#fff; --ink:#0f1e18; --muted:#5b756b; --line:#e3ebe7; --primary:#065f46; }
        @media (prefers-color-scheme: dark) { :root { --bg:#0a1512; --card:#0f1e18; --ink:#eef5f1; --muted:#8fb0a4; --line:#1e332b; --primary:#34d399; } }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .card { max-width:440px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:2.5rem 2rem; }
        .badge { width:80px; height:80px; margin:0 auto 1.5rem; border-radius:22px; background:color-mix(in srgb, var(--primary) 12%, transparent); color:var(--primary); display:flex; align-items:center; justify-content:center; }
        h1 { font-size:1.5rem; margin:0 0 .6rem; }
        p { color:var(--muted); line-height:1.6; margin:0 0 1.75rem; }
        button { padding:.8rem 1.6rem; border:none; border-radius:14px; background:var(--primary); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer; }
    </style>
</head>
<body>
    <main class="card">
        <div class="badge">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v3"/><path d="M4 21V11c0-3 3.5-4.5 8-4.5s8 1.5 8 4.5v10"/><path d="M4 21h16"/><path d="M9 21v-4a3 3 0 0 1 6 0v4"/>
            </svg>
        </div>
        <h1>Anda sedang offline</h1>
        <p>Sambungan internet terputus. Periksa koneksi Anda, lalu coba lagi. Sebagian halaman yang pernah dibuka mungkin tetap tersedia.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </main>
</body>
</html>
